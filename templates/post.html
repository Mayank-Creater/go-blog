{{ define "main" }}
<article class="post-article">
    <header class="post-header">
        <h1 class="post-title">{{ .Metadata.Title }}</h1>
        <div class="post-meta">
            <time class="post-date" datetime="{{ .Metadata.Date }}">{{ .Metadata.Date | dateFormat "January 2, 2006" }}</time>
            {{ if .Metadata.Tags }}
            <div class="post-card-tags" role="list" aria-label="Tags">
                {{ range .Metadata.Tags }}
                <span class="tag" role="listitem">{{ . }}</span>
                {{ end }}
            </div>
            {{ end }}
        </div>
    </header>
    <div class="post-content">
        {{ .Content | safeHTML }}
    </div>
</article>
{{ end }}
