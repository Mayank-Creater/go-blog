{{ define "main" }}
  <article class="post">
    <header>
      <h1>{{ .Metadata.Title }}</h1>
      <time datetime="{{ .Metadata.Date }}">{{ .Metadata.Date | dateFormat "January 2, 2006"  }}</time>
      {{ if .Metadata.Tags }}
        <div class="tags">{{ range .Metadata.Tags }}<span class="tag">{{ . }}</span>{{ end }}</div>
      {{ end }}
    </header>
    <div class="content">{{ .Content | safeHTML }}</div>
  </article>
{{ end }}
